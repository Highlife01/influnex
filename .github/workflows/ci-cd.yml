name: InfluNex CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Unit & Integration Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check & Lint
        run: npm run typecheck

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

      - name: Production Build Verification
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://www.influnex.com.tr
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: karacateknik-b202f
          FIRESTORE_DATABASE_ID: influnex-db
        run: npm run build
